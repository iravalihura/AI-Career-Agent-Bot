name: CI/CD Pipeline for AI Career Bot

# Тригери: коли запускати пайплайн
on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

jobs:
  build-and-test:
    runs-on: ubuntu-latest # Віртуальне середовище Linux для виконання завдань

    steps:
      # 1. Завантаження коду репозиторію у віртуальне середовище
      - name: Checkout code
        uses: actions/checkout@v3

      # 2. Налаштування середовища Python (під ваш стек)
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      # 3. Встановлення залежностей проєкту (для перевірки коду)
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      # 4. Налаштування Docker Buildx (для збірки контейнерів)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      # 5. Тестова збірка Docker-образу (перевірка, чи Dockerfile написаний без помилок)
      - name: Build Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: false # Ставимо false для навчального репозиторію, щоб не завантажувати на Docker Hub
          tags: ai-career-agent-bot:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
